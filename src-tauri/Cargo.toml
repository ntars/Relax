[package]
name = "relax-app"
version = "0.1.0"
description = "Relax - Family Internal System"
authors = ["Relax Team"]
license = "MIT"
edition = "2021"

# Tauri 2 移动端要求 lib 带 _lib 后缀（手册 2.4 命名约定）
[lib]
name = "relax_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2.1", features = ["devtools", "rustls-tls"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
relax-client = { path = "../crates/relax-client" }
tauri-plugin-relax-mobile = { path = "../plugins/relax-mobile" }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.android]
package_name = "com.relax.family"
version_code = 1
min_sdk_version = 24
targets = ["aarch64-linux-android"]
