[workspace]
resolver = "2"
members = [
    "crates/relax-contracts",
    "crates/relax-core",
    "crates/relax-server",
    "crates/relax-client",
    "crates/relax-xtask",
    "src-tauri",
]
default-members = [
    "crates/relax-contracts",
    "crates/relax-core",
    "crates/relax-server",
    "crates/relax-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = { version = "0.13", features = ["pem"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"
relax-contracts = { path = "crates/relax-contracts" }

[workspace.metadata.xtask]
version = "0.1.0"
