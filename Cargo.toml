[workspace]
resolver = "2"
members = [
    "crates/relax-contract",
    "crates/relax-core",
    "crates/relax-server",
    "crates/relax-client",
    "xtask",
]
default-members = ["crates/relax-contract", "crates/relax-core", "crates/relax-server", "crates/relax-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
axum = "0.7"
tower = "0.4"
tokio-rusqlite = { version = "0.2", features = ["bundled"] }
rusqlite = { version = "0.28", features = ["bundled"] }
sha2 = "0.10"
tungstenite = { version = "0.23", default-features = false, features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "0.8", features = ["chrono"] }
validator = { version = "0.18", features = ["derive"] }

[workspace.metadata.xtask]
version = "0.1.0"
